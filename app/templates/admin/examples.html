{% extends "base.html" %}
{% block content %}
<div class="flex flex-wrap justify-between items-end gap-3 mb-5">
  <h1 class="page-title">Admin Examples</h1>
  <div class="flex gap-2">
    <a class="btn-secondary" href="{{ url_for('admin.lessons') }}">Lessons</a>
    <a class="btn-secondary" href="{{ url_for('admin.items') }}">Items</a>
    <a class="btn-primary" href="{{ url_for('admin.new_example') }}">New Example</a>
  </div>
</div>
<form class="card p-4 mb-4 flex gap-3">
  <input class="input" name="q" value="{{ search }}" placeholder="Search examples">
  <input class="input" name="type" value="{{ item_type }}" placeholder="Item type">
  <button class="btn-secondary">Filter</button>
</form>
<div class="card overflow-hidden">
  <table class="w-full text-sm">
    <tr class="text-left text-slate-400"><th class="p-3">Japanese</th><th>English</th><th>Item</th><th></th></tr>
    {% for example in examples %}
      <tr class="border-t border-white/10">
        <td class="p-3">{{ example.japanese }}</td>
        <td>{{ example.english }}</td>
        <td>{{ example.learning_item.title }}</td>
        <td class="text-right p-3">
          <a class="chip" href="{{ url_for('admin.edit_example', example_id=example.id) }}">Edit</a>
          <form method="post" action="{{ url_for('admin.delete_example', example_id=example.id) }}" class="inline"><button class="chip">Delete</button></form>
        </td>
      </tr>
    {% else %}
      <tr><td class="p-3 text-slate-400" colspan="4">No examples found.</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}

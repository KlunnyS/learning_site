{% extends "base.html" %}
{% block content %}
<section class="min-h-[78vh] grid content-center">
  <div class="max-w-3xl">
    <h1 class="text-5xl sm:text-7xl font-black leading-tight">NihongoPath</h1>
    <p class="mt-5 text-xl text-slate-300">Track kana, kanji, vocabulary, grammar, reading, listening, writing, reviews, and mistakes in one dark Japanese study dashboard.</p>
    <div class="mt-8 flex flex-wrap gap-3">
      <a class="btn-primary" href="{{ url_for('auth.register') }}">Create Account</a>
      <a class="btn-secondary" href="{{ url_for('auth.login') }}">Login</a>
    </div>
  </div>
</section>
{% endblock %}

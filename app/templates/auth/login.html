{% extends "base.html" %}
{% block title %}Login | NihongoPath{% endblock %}
{% block content %}
<section class="max-w-md">
  <h1 class="page-title">Login</h1>
  <form method="post" class="card p-6 space-y-4">
    <label class="field-label">Username or email<input class="input" name="identifier" required></label>
    <label class="field-label">Password<input class="input" type="password" name="password" required></label>
    <button class="btn-primary w-full">Login</button>
  </form>
</section>
{% endblock %}
